<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="test_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>test_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Speech recognition helper -->
  <script>
    var _activeRecognition = null;

    window.advocateSpeechAvailable = function() {
      return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    };

    window.advocateStartSpeech = function(onResult, onEnd) {
      if (_activeRecognition) {
        try { _activeRecognition.abort(); } catch(e) {}
        _activeRecognition = null;
      }
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { onEnd('not_available'); return; }
      var r = new SR();
      r.continuous = false;
      r.interimResults = false;
      r.lang = 'en-US';
      r.onresult = function(event) {
        var t = '';
        for (var i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal) t += event.results[i][0].transcript;
        }
        onResult(t);
      };
      r.onerror = function(e) { _activeRecognition = null; onEnd(e.error || 'error'); };
      r.onend = function() { _activeRecognition = null; onEnd(''); };
      _activeRecognition = r;
      r.start();
    };

    window.advocateStopSpeech = function() {
      if (_activeRecognition) {
        try { _activeRecognition.stop(); } catch(e) {}
        _activeRecognition = null;
      }
    };
  </script>
</body>
</html>
