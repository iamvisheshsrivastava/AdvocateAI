services:
  # ── nginx-proxy: auto-configures nginx from VIRTUAL_HOST env vars ────────
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.6
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx-certs:/etc/nginx/certs
      - nginx-vhosts:/etc/nginx/vhost.d
      - nginx-html:/usr/share/nginx/html

  # ── acme-companion: gets + auto-renews Let's Encrypt certs ───────────────
  acme-companion:
    image: nginxproxy/acme-companion:2.4
    restart: unless-stopped
    depends_on:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx-certs:/etc/nginx/certs
      - nginx-vhosts:/etc/nginx/vhost.d
      - nginx-html:/usr/share/nginx/html
      - acme-state:/etc/acme.sh
    environment:
      NGINX_PROXY_CONTAINER: nginx-proxy
      DEFAULT_EMAIL: srivastava.vishesh9@gmail.com

  # ── Database ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis cache ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/iamvisheshsrivastava/advocateai-backend:latest}
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  # ── Flutter frontend (nginx) ──────────────────────────────────────────────
  # nginx-proxy routes traffic here via VIRTUAL_HOST.
  # acme-companion issues the Let's Encrypt cert via LETSENCRYPT_HOST.
  # The internal nginx.conf proxies /api/* to the backend service.
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/iamvisheshsrivastava/advocateai-frontend:latest}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    environment:
      VIRTUAL_HOST: advocateai.duckdns.org
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: advocateai.duckdns.org

volumes:
  postgres_data:
  redis_data:
  nginx-certs:
  nginx-vhosts:
  nginx-html:
  acme-state:
