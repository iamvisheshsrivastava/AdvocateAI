services:
  # ── Caddy: reverse proxy + automatic Let's Encrypt SSL ───────────────────
  # One-line Caddyfile: advocateai.duckdns.org { reverse_proxy frontend:80 }
  # Caddy handles HTTP→HTTPS redirect, cert issuance, and auto-renewal.
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # Persists TLS certs across restarts
      - caddy-config:/config
    depends_on:
      - frontend

  # ── Database ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis cache ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/iamvisheshsrivastava/advocateai-backend:latest}
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  # ── Flutter frontend (nginx) ──────────────────────────────────────────────
  # Caddy reverse-proxies to this container.
  # The internal nginx.conf serves Flutter files and proxies /api/* → backend.
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/iamvisheshsrivastava/advocateai-frontend:latest}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

volumes:
  postgres_data:
  redis_data:
  caddy-data:
  caddy-config:
