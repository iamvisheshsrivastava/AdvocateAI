name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ── 1. Tests ──────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest
      - run: docker compose --env-file .env.example -f docker-compose.prod.yml config

  # ── 2a. Backend Docker image (Python/FastAPI) ────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/advocateai-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  # ── 2b. Flutter web build + frontend Docker image (nginx) ────────────────
  #
  # Building Flutter natively (not inside Docker) avoids pulling the 2 GB
  # cirruslabs/flutter image and lets us package the result in a tiny
  # nginx:alpine image (~25 MB) instead of a 2 GB Flutter image.
  #
  build-frontend:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Install Flutter SDK (cached between runs).
      # Must match pubspec.yaml sdk: ^3.11.0 — Flutter 3.41.x ships with Dart 3.11.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.8"
          channel: "stable"
          cache: true

      # Cache pub packages separately for faster repeat builds
      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            test_app/.dart_tool
          key: flutter-pub-${{ hashFiles('test_app/pubspec.lock') }}
          restore-keys: flutter-pub-

      - name: Install Flutter dependencies
        working-directory: test_app
        run: flutter pub get

      - name: Build Flutter web (release)
        working-directory: test_app
        run: flutter build web --release --web-renderer html

      # Package pre-built files in a minimal nginx image
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image (nginx + static files)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: test_app/Dockerfile.nginx
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/advocateai-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ── 3. Deploy to DigitalOcean ─────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    env:
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER || 'root' }}
      DO_DEPLOY_PATH: ${{ secrets.DO_DEPLOY_PATH || '/root/AdvocateAI' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$DO_HOST" >> ~/.ssh/known_hosts

      - name: Sync repository files to droplet
        run: |
          ssh "$DO_USER@$DO_HOST" "mkdir -p '$DO_DEPLOY_PATH'"
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.venv' \
            --exclude 'node_modules' \
            --exclude 'test_app/build' \
            --exclude 'mlruns' \
            --exclude 'artifacts' \
            ./ "$DO_USER@$DO_HOST:$DO_DEPLOY_PATH/"

      - name: Write production env file on server
        run: |
          ssh "$DO_USER@$DO_HOST" "cat > '$DO_DEPLOY_PATH/.env.production'" << ENVEOF
          PUBLIC_APP_URL=${{ secrets.PUBLIC_APP_URL }}
          PUBLIC_API_BASE_URL=${{ secrets.PUBLIC_API_BASE_URL }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS || 'https://advocateai.duckdns.org,http://advocateai.duckdns.org,http://159.89.163.233' }}
          CORS_ALLOW_ORIGIN_REGEX=${{ secrets.CORS_ALLOW_ORIGIN_REGEX || 'https?://(localhost|127\.0\.0\.1|advocateai\.duckdns\.org)(:\d+)?' }}
          LOG_LEVEL=${{ secrets.LOG_LEVEL || 'INFO' }}
          DB_HOST=db
          DB_PORT=5432
          DB_NAME=${{ secrets.DB_NAME || 'advocateai' }}
          DB_USER=${{ secrets.DB_USER || 'advocateai' }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_CONNECT_TIMEOUT=5
          POSTGRES_DB=${{ secrets.DB_NAME || 'advocateai' }}
          POSTGRES_USER=${{ secrets.DB_USER || 'advocateai' }}
          POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_HOST=redis
          REDIS_PORT=6379
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL=${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GEMINI_DEFAULT_TIMEOUT=${{ secrets.GEMINI_DEFAULT_TIMEOUT || '20' }}
          GEMINI_ANALYSIS_TIMEOUT=${{ secrets.GEMINI_ANALYSIS_TIMEOUT || '35' }}
          GEMINI_BRIEF_TIMEOUT=${{ secrets.GEMINI_BRIEF_TIMEOUT || '25' }}
          GEMINI_CHAT_TIMEOUT=${{ secrets.GEMINI_CHAT_TIMEOUT || '25' }}
          GEMINI_DOCUMENT_TIMEOUT=${{ secrets.GEMINI_DOCUMENT_TIMEOUT || '30' }}
          MLOPS_ENABLED=false
          MLOPS_LOG_PROMPTS=false
          MLFLOW_ENABLED=false
          MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_EXPERIMENT_NAME=AdvocateAI
          WANDB_ENABLED=false
          WANDB_PROJECT=AdvocateAI
          WANDB_ENTITY=${{ secrets.WANDB_ENTITY }}
          WANDB_MODE=offline
          BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/advocateai-backend:latest
          FRONTEND_IMAGE=ghcr.io/${{ github.repository_owner }}/advocateai-frontend:latest
          DOMAIN=${{ secrets.DOMAIN || 'advocateai.duckdns.org' }}
          ACME_EMAIL=${{ secrets.ACME_EMAIL || 'srivastava.vishesh9@gmail.com' }}
          ENVEOF
          ssh "$DO_USER@$DO_HOST" "sed -i 's/^[[:space:]]*//' '$DO_DEPLOY_PATH/.env.production'"

      - name: Pull images and restart containers
        run: |
          ssh "$DO_USER@$DO_HOST" "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh "$DO_USER@$DO_HOST" "cd '$DO_DEPLOY_PATH' && \
            docker compose --env-file .env.production -f docker-compose.prod.yml pull && \
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans && \
            docker compose --env-file .env.production -f docker-compose.prod.yml ps"
